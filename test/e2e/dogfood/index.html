<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dogfood — barcodes-new scanner page</title>
  <!-- Markup copied from barcodes-new/resources/views/pages/tools/barcode-scanner.blade.php (styling removed). -->
  <style>[data-barcode-scanner] [hidden] { display: none !important; } video { width: 320px; height: 240px; background: #000; }</style>
  <script type="importmap">
    {
      "imports": {
        "@yourbrand/scanner": "/dist/index.js",
        "barcode-detector/ponyfill": "/node_modules/barcode-detector/dist/es/ponyfill.js",
        "zxing-wasm/reader/zxing_reader.wasm?url": "/test/e2e/dogfood/wasm-url.js"
      }
    }
  </script>
</head>
<body>
<div data-barcode-scanner data-lookup-url="/api/flat-lookup/__BARCODE__" data-fallback-image="/examples/assets/shoe.svg">
  <h1>Barcode scanner</h1>
  <div>
    <video data-preview autoplay muted playsinline aria-label="Camera preview"></video>
    <p data-status role="status" aria-live="polite">Camera is off. Start it to scan, or enter a barcode below.</p>
    <button type="button" data-start>Start camera</button>
    <button type="button" data-stop hidden>Stop camera</button>
  </div>

  <div>
    <h2>Enter a barcode instead</h2>
    <form data-manual-form>
      <label for="scanner-barcode">UPC or EAN barcode digits</label>
      <input id="scanner-barcode" data-manual-input type="text" inputmode="numeric" pattern="[0-9]{8,15}" maxlength="15" required autocomplete="off">
      <button type="submit">Look up</button>
    </form>
    <p data-manual-feedback hidden role="status" aria-live="polite"></p>
    <div data-manual-result hidden>
      <img data-manual-image hidden alt="Product image" width="96" height="96">
      <p>Barcode <span data-manual-value></span></p>
      <p data-manual-name></p>
      <p data-manual-details style="white-space: pre-line"></p>
      <a data-manual-link href="#">View barcode page</a>
    </div>
  </div>

  <dialog data-result-dialog aria-labelledby="scanner-result-title">
    <h2 id="scanner-result-title">Barcode scanned</h2>
    <p data-value></p>
    <p data-lookup-status role="status" aria-live="polite"></p>
    <div data-product hidden>
      <img data-image hidden alt="Product image" width="96" height="96">
      <p data-name></p>
      <p data-details style="white-space: pre-line"></p>
    </div>
    <a data-page-link hidden href="#">View barcode page</a>
    <button type="button" data-scan-again>Scan again</button>
  </dialog>
</div>
<script type="module" src="/examples/dogfood-barcodes-new/barcode-scanner.js"></script>
</body>
</html>
